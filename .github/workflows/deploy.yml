# Build and deploy to Cloudflare.
#
# Runs on every push to main, and on demand from the Actions tab (or the API).
# The one thing it needs from the repository is the CLOUDFLARE_API_TOKEN
# secret — a token made from Cloudflare's "Edit Cloudflare Workers" template
# with D1 → Edit added, so it can bind the database. The account id below is
# not a secret: it appears in every dashboard URL.
#
# Deploying from here rather than a laptop means the deploy is the same every
# time, and it works from anywhere the repository does.
name: Deploy

on:
  push:
    # The migration branch deploys too, until it is merged: GitHub only
    # registers a workflow's manual trigger once the file is on the default
    # branch, but a push runs the workflow from whatever ref was pushed.
    branches: [main, claude/great-bell-l9jxi8]
  workflow_dispatch:

# Never two deploys at once; a second push waits for the first to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same checks a contributor runs locally; a deploy that skips them
      # is how a typo reaches a classroom.
      - run: npm run typecheck
      - run: npm run build

      # Worker secrets that live in GitHub. Any of these present as a repository
      # secret is pushed into the Worker with `wrangler secret put` on every
      # deploy; one that isn't is skipped, not fatal. That is what lets a key be
      # set or rotated from a phone — add or update the repository secret, push
      # or re-run, done. `printf '%s'` rather than echo: a trailing newline
      # inside a key is an invisible way to get a 401.
      - name: Push Worker secrets that GitHub holds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 78e0f283e7e45753dd05f72a7e5583d4
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          for name in ANTHROPIC_API_KEY GIPHY_API_KEY PEXELS_API_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
              echo "pushed $name"
            else
              echo "skipped $name (no repository secret of that name)"
            fi
          done

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 78e0f283e7e45753dd05f72a7e5583d4
          command: deploy

      - name: Confirm the deployment answers
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://wallama.com/api/health | grep -q '"ok":true'; then
              echo "wallama.com is up"; exit 0
            fi
            sleep 5
          done
          echo "wallama.com did not answer after the deploy"; exit 1
